name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install ruff
      - name: Ruff
        run: ruff check src/ tests/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install
        run: pip install -e .[dev]
      - name: Assert the Core we resolved is the Core we mean to test
        # pip resolves `homeassistant` transitively through
        # pytest-homeassistant-custom-component. On Python 3.13 it silently
        # walks back to 2026.2.3, because every Core from 2026.3.0 requires
        # Python >= 3.14.2 — and the suite then passes green over a Core we do
        # not ship. Fail loudly instead of testing the wrong thing.
        run: |
          resolved=$(python -c "import homeassistant.const as c; print(c.__version__)")
          echo "resolved homeassistant: $resolved"
          python - "$resolved" <<'PY'
          import sys

          FLOOR = (2026, 3)  # pinned constant, never read from the install
          got = tuple(int(part) for part in sys.argv[1].split(".")[:2])
          if got < FLOOR:
              sys.exit(
                  f"::error::resolved homeassistant {sys.argv[1]} is below "
                  f"{FLOOR[0]}.{FLOOR[1]}, so this run tested a Core we do not ship"
              )
          PY
      - name: Pytest
        run: pytest tests/ -v --cov=src/greenautarky_site --cov-report=term

  build-consistency:
    # Sanity: the integration's `manifest.json` version must match
    # `pyproject.toml` version. Bumping one without the other has bitten
    # us before (drift between OS-pinned version + manifest-reported).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare versions
        run: |
          py_ver=$(grep '^version' pyproject.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          mf_ver=$(python -c "import json; print(json.load(open('src/greenautarky_site/manifest.json'))['version'])")
          echo "pyproject: $py_ver"
          echo "manifest:  $mf_ver"
          [ "$py_ver" = "$mf_ver" ] || { echo "::error::version drift"; exit 1; }

  bundle-integrity:
    # Offline content-hash gate: the committed frontend_bundle/ bytes must
    # match SHA256SUMS. Catches a stale/frozen or tampered bundle without
    # cloning or building the (archived) frontend fork.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify frontend bundle content-hash
        run: scripts/build_bundle.sh --check
