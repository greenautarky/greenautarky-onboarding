name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install ruff
      - name: Ruff
        run: ruff check src/ tests/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e .[dev]
      - name: Pytest
        run: pytest tests/ -v --cov=src/greenautarky_site --cov-report=term

  browser:
    # Client-side code proven in a real browser against a local fake page —
    # no device, no network (Playwright answers every request itself). Today:
    # the login page's "Forgot password?" retarget script (ADR-0040), which the
    # unit tier can only see as a string. GA_REQUIRE_BROWSER=1 turns a missing
    # Playwright into a FAILURE, not a skip.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        run: |
          pip install -e .[dev] playwright
          playwright install chromium --with-deps
      - name: Browser tier
        env:
          GA_REQUIRE_BROWSER: "1"
        run: pytest tests/browser -m browser -v -o addopts=""

  build-consistency:
    # Sanity: the integration's `manifest.json` version must match
    # `pyproject.toml` version. Bumping one without the other has bitten
    # us before (drift between OS-pinned version + manifest-reported).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare versions
        run: |
          py_ver=$(grep '^version' pyproject.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          mf_ver=$(python -c "import json; print(json.load(open('src/greenautarky_site/manifest.json'))['version'])")
          echo "pyproject: $py_ver"
          echo "manifest:  $mf_ver"
          [ "$py_ver" = "$mf_ver" ] || { echo "::error::version drift"; exit 1; }

  bundle-integrity:
    # Offline gate on the committed frontend_bundle/. Two questions, and they
    # are NOT the same one:
    #   1. are the bytes unchanged and the file set intact?  (SHA256SUMS)
    #   2. are they the RIGHT bytes?                         (paths vs component)
    # On 2026-09-14 (1) was green while (2) was false: the bundle asked for a
    # pre-rename path prefix and API namespace, everything 404'd, and a freshly
    # flashed device rendered a blank page. --check now answers both.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify frontend bundle content-hash and agreement with the component
        run: scripts/build_bundle.sh --check

      # The gate must be able to go both red and green, and a mutation must
      # turn the SPECIFIC case red. Proven on every PR so the gate cannot rot
      # into decoration between the day it is written and the day it is needed.
      - name: Gate self-test (must-fail and must-pass fixtures)
        run: ./tests/gates/bundle_paths/selftest.sh
