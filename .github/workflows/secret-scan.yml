name: Secret Scan

# Why this exists alongside GitHub's own secret scanning:
#
# GitHub secret scanning only matches KNOWN PROVIDER token formats. The two
# settings that would catch generic credentials —
# `secret_scanning_non_provider_patterns` and `secret_scanning_validity_checks`
# — are not available on this org's plan (verified 2026-07-29 across every repo:
# non-provider patterns read `disabled` on all public repos, and the org-level
# `secret_scanning_validity_checks_enabled` is false). On PRIVATE repos there is
# no GitHub secret scanning at all — `security_and_analysis` comes back empty.
#
# That gap is not theoretical. The InfluxDB `device_writer` credential that sat
# in greenautarky/ha-operating-system's PUBLIC history from 2026-02-03 until it
# was revoked on 2026-07-27 was a plain user/password pair — no provider pattern
# would ever have matched it.
#
# gitleaks closes that gap with entropy + regex rules. It also scans HISTORY,
# which push protection by construction cannot: push protection only guards
# commits going forward.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '42 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is required for anything but a PR diff — a shallow
          # clone silently scans almost nothing and still reports success.
          fetch-depth: 0

      # Pinned by DIGEST, not by tag: a moved tag can swap the scanner binary
      # underneath us. Same rule as the OS package source pins.
      # v8.30.1, resolved 2026-07-28. To update:
      #   docker buildx imagetools inspect ghcr.io/gitleaks/gitleaks:vX.Y.Z
      - name: Run gitleaks
        env:
          IMAGE: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        run: |
          set -euo pipefail
          mkdir -p reports

          # Scheduled and manual runs sweep the whole history; PR runs check
          # only what the PR adds, so the job stays fast on every push.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SCOPE="--log-opts=origin/${{ github.base_ref }}..HEAD"
            echo "Scope: PR diff against ${{ github.base_ref }}"
          else
            SCOPE="--log-opts=--all"
            echo "Scope: complete history (all refs)"
          fi

          set +e
          # --config is passed explicitly rather than relying on auto-discovery,
          # so that a renamed or deleted .gitleaks.toml is a hard error instead of
          # a silent fallback to the default ruleset.
          docker run --rm -v "$PWD:/repo" -w /repo "$IMAGE" \
            detect --source=/repo --config=/repo/.gitleaks.toml --redact --verbose \
            --report-format=sarif --report-path=/repo/reports/gitleaks.sarif \
            $SCOPE
          rc=$?
          set -e

          # gitleaks: 0 = clean, 1 = leaks found, anything else = it broke.
          # A scanner that failed to run must never read as "no leaks" — the
          # same fail-closed rule as the CVE scan.
          if [ "$rc" -gt 1 ]; then
            echo "::error::gitleaks did not run correctly (exit $rc) — this is NOT a clean result"
            exit 1
          fi

          # rc == 1 is ambiguous. Verified against this pinned digest on
          # 2026-07-29: gitleaks exits 1 BOTH for "leaks found" AND for a fatal
          # config error (missing or malformed .gitleaks.toml logs `FTL unable to
          # load gitleaks config` and still exits 1, not >1).
          #
          # Both cases must fail the job — but they must not be reported as the
          # same thing. A broken scanner announced as "N secrets found" sends the
          # next person hunting a secret that does not exist, and invites the
          # wrong fix (allowlisting) for what is actually a build problem.
          # No report file therefore means "the scanner did not run", never "clean".
          if [ ! -s reports/gitleaks.sarif ]; then
            echo "::error::gitleaks produced no report (exit $rc) — the scanner did not run. This is NOT a clean result."
            exit 1
          fi

          COUNT=$(jq '[.runs[].results[]] | length' reports/gitleaks.sarif 2>/dev/null || echo "?")
          {
            echo "## Secret scan"
            echo ""
            echo "- Scope: \`$SCOPE\`"
            echo "- Findings: **$COUNT**"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$rc" -eq 1 ]; then
            echo "::error::gitleaks found $COUNT potential secret(s) — see the SARIF artifact"
            exit 1
          fi
          echo "No secrets found."

      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif-${{ github.run_number }}
          path: reports/
          retention-days: 90
